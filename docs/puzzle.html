<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wordle-in-One Puzzle</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1b; --muted:#787c7e; --line:#d3d6da; --g:#6aaa64; --y:#c9b458; --b:#787c7e; --empty:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121213; --fg:#f8f8f8; --muted:#a0a0a0; --line:#3a3a3c; --g:#538d4e; --y:#b59f3b; --b:#3a3a3c; --empty:#121213; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 -apple-system, system-ui, sans-serif; }
  main { max-width: 420px; margin: 0 auto; padding: 28px 16px 60px; text-align: center; }
  h1 { font-size: 24px; margin: 0 0 6px; letter-spacing: 1px; }
  p.sub { color: var(--muted); margin: 0 0 24px; font-size: 14px; }
  .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin: 18px 0 8px; }
  .row { display:flex; gap:6px; justify-content:center; margin-bottom:6px; }
  .t { width:56px; height:56px; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:700;
       text-transform:uppercase; border:2px solid var(--line); background:var(--empty); color:var(--fg); }
  .t.G, .t.Y, .t.B { color:#fff; border-color:transparent; }
  .G { background: var(--g); } .Y { background: var(--y); } .B { background: var(--b); }
  .t.filled { border-color: var(--muted); }
  #guesses { color: var(--muted); font-size: 14px; letter-spacing: 1px; min-height: 20px; }
  #guesses s { margin: 0 4px; }
  .shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  #msg { min-height: 24px; margin: 14px 0; font-weight: 600; }
  input#entry { position:absolute; opacity:0; pointer-events:none; }
  button { font: inherit; padding:8px 14px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); cursor:pointer; margin: 4px; }
  .kb { margin-top: 18px; user-select:none; }
  .kb .krow { display:flex; gap:4px; justify-content:center; margin-bottom:6px; }
  .kb button { margin:0; padding:0; height:50px; min-width:0; flex:1; max-width:40px; font-weight:600; text-transform:uppercase; background:var(--line); border:none; }
  .kb button.wide { max-width:64px; font-size:12px; }
  a { color: var(--muted); }
  @media (max-width: 380px) { main { padding: 20px 8px 40px; } .t { width:48px; height:48px; font-size:24px; } }
</style>
</head>
<body>
<main>
  <h1>WORDLE-IN-ONE</h1>
  <p class="sub">Only one word fits the clue's colors. Find it.</p>
  <div id="game" hidden>
    <div class="label">Clue</div>
    <div id="clue" class="row"></div>
    <div class="label">Your guess</div>
    <div id="current" class="row"></div>
    <div id="guesses"></div>
    <div id="msg"></div>
    <div>
      <span id="after" hidden><button id="share">Copy result</button></span>
      <span id="giveup-wrap"><button id="giveup">Give up</button></span>
      <button id="reset">Reset</button>
      <button id="copylink">Copy link</button>
    </div>
    <div class="kb" id="kb"></div>
  </div>
  <div id="bad" hidden><p>This puzzle link is broken or incomplete.</p></div>
  <p style="margin-top:28px;font-size:13px"><a href="index.html">Browse puzzles</a> · <a href="themes.html">Themed puzzles</a></p>
</main>
<script>
// Puzzle-link codec: hides a clue/target pair in a 12-character base-36 token
// (10 chars of scrambled letters + 2-char checksum). Obfuscation, not security.
// Keep in sync with codec.py.
const CODEC_KEY = [3, 17, 8, 22, 11, 5, 19, 1, 14, 9];
const codecCheck = v => v.reduce((h, x) => (h * 31 + x + 7) % 1296, 0);
function encodePair(clue, target) {
  const v = [...(clue + target).toLowerCase()].map(ch => ch.charCodeAt(0) - 97);
  if (v.length !== 10 || v.some(x => x < 0 || x > 25)) throw new Error('need two 5-letter words');
  let prev = 0, n = 0;
  v.forEach((x, i) => { prev = (x + CODEC_KEY[i] + prev * 7) % 26; n = n * 26 + prev; });
  return n.toString(36).padStart(10, '0') + codecCheck(v).toString(36).padStart(2, '0');
}
function decodePair(token) {
  if (!/^[0-9a-z]{12}$/.test(token || '')) return null;
  let n = parseInt(token.slice(0, 10), 36);
  if (n >= 26 ** 10) return null;
  const enc = [];
  for (let i = 0; i < 10; i++) { enc.unshift(n % 26); n = Math.floor(n / 26); }
  let prev = 0;
  const v = enc.map((d, i) => { const x = ((d - CODEC_KEY[i] - prev * 7) % 26 + 26) % 26; prev = d; return x; });
  if (codecCheck(v) !== parseInt(token.slice(10), 36)) return null;
  const s = String.fromCharCode(...v.map(x => x + 97));
  return { clue: s.slice(0, 5), target: s.slice(5) };
}
// Wordle scoring: G = right spot, Y = elsewhere, B = absent (duplicates handled).
function scoreWord(guess, target) {
  const res = Array(5).fill('B'), left = {};
  for (let i = 0; i < 5; i++) {
    if (guess[i] === target[i]) res[i] = 'G'; else left[target[i]] = (left[target[i]] || 0) + 1;
  }
  for (let i = 0; i < 5; i++) {
    if (res[i] === 'B' && left[guess[i]] > 0) { res[i] = 'Y'; left[guess[i]]--; }
  }
  return res.join('');
}
// Solved puzzles, kept per browser as {token: true}. Storage can be missing or blocked.
const SOLVED_KEY = 'wio-solved';
function loadSolved() {
  try { return JSON.parse(localStorage.getItem(SOLVED_KEY)) || {}; } catch { return {}; }
}
function markSolved(token) {
  try { const s = loadSolved(); s[token] = true; localStorage.setItem(SOLVED_KEY, JSON.stringify(s)); } catch {}
}

const $ = id => document.getElementById(id);
const token = new URLSearchParams(location.search).get('p');
const pair = decodePair(token);
const tiles = (word, pat) => [...word.padEnd(5)].map((ch, i) =>
  `<div class="t ${pat ? pat[i] : (ch.trim() ? 'filled' : '')}">${ch.trim()}</div>`).join('');
if (!pair) {
  $('bad').hidden = false;
} else {
  const { clue, target } = pair;
  const tries = [];
  let cur = '', done = false;
  $('game').hidden = false;
  $('clue').innerHTML = tiles(clue, scoreWord(clue, target));
  const draw = () => {
    // Wrong guesses get no colors: that would leak extra clues.
    const wrong = tries.filter(g => g !== target);
    $('guesses').innerHTML = wrong.length ? 'Not it: ' + wrong.map(g => `<s>${g.toUpperCase()}</s>`).join('') : '';
    $('current').innerHTML = done ? tiles(target, 'GGGGG') : tiles(cur);
  };
  const finish = text => {
    done = true; $('msg').textContent = text; $('after').hidden = false; $('giveup-wrap').hidden = true; draw();
  };
  const submit = () => {
    if (cur.length < 5) { $('current').classList.add('shake'); setTimeout(() => $('current').classList.remove('shake'), 300); return; }
    tries.push(cur); cur = '';
    if (tries.at(-1) === target) markSolved(token), finish(tries.length === 1 ? 'Wordle in one!' : `Solved on try ${tries.length}.`);
    else { $('msg').textContent = 'Not it — try again.'; draw(); }
  };
  const key = k => {
    if (done) return;
    if (k === 'enter') submit();
    else if (k === 'back') cur = cur.slice(0, -1);
    else if (/^[a-z]$/.test(k) && cur.length < 5) {
      cur += k;
      if (cur === target) return submit();  // right answer wins without pressing Enter
    }
    draw();
  };
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'Enter') key('enter'); else if (e.key === 'Backspace') key('back'); else key(e.key.toLowerCase());
  });
  $('kb').innerHTML = ['qwertyuiop', 'asdfghjkl', '+zxcvbnm-'].map(r => `<div class="krow">${[...r].map(c =>
    c === '+' ? '<button class="wide" data-k="enter">Enter</button>' :
    c === '-' ? '<button class="wide" data-k="back">⌫</button>' : `<button data-k="${c}">${c}</button>`).join('')}</div>`).join('');
  $('kb').onclick = e => { const k = e.target.dataset.k; if (k) key(k); };
  let gaveUp = false;
  $('giveup').onclick = () => { gaveUp = true; finish(`It was ${target.toUpperCase()}.`); };
  // Start the puzzle over. A saved win stays saved.
  $('reset').onclick = e => {
    tries.length = 0; cur = ''; done = gaveUp = false;
    $('msg').textContent = ''; $('after').hidden = true; $('giveup-wrap').hidden = false;
    $('share').textContent = 'Copy result';
    e.currentTarget.blur();  // so the next Enter submits a guess instead of resetting again
    draw();
  };
  $('copylink').onclick = () => {
    navigator.clipboard.writeText(location.href).then(() => {
      $('copylink').textContent = 'Copied!';
      setTimeout(() => { $('copylink').textContent = 'Copy link'; }, 1500);
    });
  };
  $('share').onclick = () => {
    const E = { G: '🟩', Y: '🟨', B: '⬜' }, em = [...scoreWord(clue, target)].map(c => E[c]).join('');
    const result = gaveUp ? 'gave up' : tries.length === 1 ? 'solved in one!' : `solved on try ${tries.length}`;
    const text = `Wordle-in-One: ${result}\n${em}\n${location.href}`;
    navigator.clipboard.writeText(text).then(() => { $('share').textContent = 'Copied!'; });
  };
  draw();
}
</script>
</body>
</html>
