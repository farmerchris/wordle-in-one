<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wordle-in-One Themes</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1b; --muted:#787c7e; --line:#d3d6da; --g:#6aaa64; --y:#c9b458; --b:#787c7e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121213; --fg:#f8f8f8; --muted:#a0a0a0; --line:#3a3a3c; --g:#538d4e; --y:#b59f3b; --b:#3a3a3c; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 -apple-system, system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 14px; font-size: 13px; }
  nav { font-size: 13px; margin-bottom: 16px; }
  nav a, .jump a { color: var(--muted); }
  .jump { font-size: 13px; line-height: 1.9; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  .jump a { margin-right: 10px; white-space: nowrap; }
  h2 { font-size: 17px; margin: 26px 0 10px; text-transform: capitalize; }
  h2 .n { color: var(--muted); font-weight: 400; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
  .card { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 10px;
          border:1px solid var(--line); border-radius:8px; color:var(--fg); text-decoration:none; }
  .card:hover { border-color: var(--muted); }
  .row { display:flex; gap:3px; }
  .t { width:28px; height:28px; display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; border-radius:3px; text-transform:uppercase; font-size:14px; }
  .G { background: var(--g); } .Y { background: var(--y); } .B { background: var(--b); }
  .play { font-size: 13px; color: var(--muted); white-space: nowrap; }
  .card.won { border-color: var(--g); }
  .card.won .play { color: var(--g); font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Wordle-in-One Themes</h1>
  <p class="sub">The clue and the hidden answer share the theme. Only one Wordle answer word fits each clue's colors. __SUMMARY__<span id="progress"></span></p>
  <nav><a href="index.html">Browse all puzzles</a></nav>
  <div class="jump">__JUMP__</div>
__SECTIONS__
</main>
<script>
__CODEC__
function showSolved() {
  const solved = loadSolved();
  let n = 0;
  for (const a of document.querySelectorAll('a.card')) {
    const won = !!solved[new URL(a.href).searchParams.get('p')];
    a.classList.toggle('won', won);
    a.querySelector('.play').textContent = won ? '✓ Solved' : 'Play ↗';
    n += won;
  }
  document.getElementById('progress').textContent = n ? ` You've solved ${n}.` : '';
}
window.addEventListener('storage', showSolved);
window.addEventListener('pageshow', showSolved);
</script>
</body>
</html>
